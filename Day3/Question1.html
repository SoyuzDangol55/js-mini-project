<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simple Todo App</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:400px;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:darkblue;
        }

        #Error{
            display:block;
            margin-bottom:10px;
            font-size:14px;
        }

        ul{
            list-style:none;
            margin-top:20px;
        }

        li{
            background:#eee;
            padding:10px;
            margin-bottom:10px;
            border-radius:5px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .delete-btn{
            background:red;
            width:auto;
            padding:5px 10px;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Todo List App</h1>

        <input type="text" id="words" placeholder="Enter your task">

        <span id="Error"></span>

        <button id="submit">Add Task</button>

        <ul id="taskList"></ul>

    </div>

    <script>

        const task = document.getElementById('words');
        const error = document.getElementById('Error');
        const btn = document.getElementById('submit');
        const taskList = document.getElementById('taskList');

        btn.addEventListener('click', function(){

            const finaltask = task.value.trim();

            // Validation
            if(finaltask === ""){

                error.textContent = "Please Enter Your Task";
                error.style.color = "red";

                return;
            }

            // Remove error message
            error.textContent = "";

            // Create li
            const li = document.createElement('li');

            li.textContent = finaltask;

            // Create delete button
            const deleteBtn = document.createElement('button');

            deleteBtn.textContent = "Delete";
            deleteBtn.classList.add('delete-btn');

            // Delete task
            deleteBtn.addEventListener('click', function(){

                li.remove();

            });

            // Add button inside li
            li.appendChild(deleteBtn);

            // Add li to ul
            taskList.appendChild(li);

            // Clear input
            task.value = "";

        });

    </script>

</body>
</html>
