<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Counter</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 500px; }
    textarea { width: 100%; padding: 10px; font-size: 15px; resize: vertical; box-sizing: border-box; }
    #stats { display: flex; gap: 20px; margin-top: 10px; }
    .stat { background: #f0f0f0; padding: 10px 16px; border-radius: 8px; }
    .stat span { display: block; font-size: 22px; font-weight: bold; }
    .stat small { color: #666; font-size: 12px; }
  </style>
</head>
<body>

  <textarea id="txt" rows="6" placeholder="Start typing..."></textarea>

  <div id="stats">
    <div class="stat"><span id="chars">0</span><small>Characters</small></div>
    <div class="stat"><span id="words">0</span><small>Words</small></div>
    <div class="stat"><span id="lines">0</span><small>Lines</small></div>
  </div>

  <script>
    const txt = document.getElementById('txt');

        txt.addEventListener('input', function () {
        const val = txt.value;

        // Character count
        document.getElementById('chars').textContent = val.length;

        // Word count
        if (val.trim() === '') {
            document.getElementById('words').textContent = 0;
        } else {
            document.getElementById('words').textContent = val.trim().split(/\s+/).length;
        }

        // Line count
        if (val === '') {
            document.getElementById('lines').textContent = 0;
        } else {
            document.getElementById('lines').textContent = val.split('\n').length;
        }
        });
  </script>

</body>
</html>
