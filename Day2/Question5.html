<!DOCTYPE html>
<html>
<head>
    <title>Simple Quiz App</title>
</head>
<body>

    <h2 id="question"></h2>

    <button onclick="checkAnswer('HTML')">HTML</button>
    <button onclick="checkAnswer('CSS')">CSS</button>
    <button onclick="checkAnswer('JavaScript')">JavaScript</button>

    <p id="result"></p>

    <script>

        let correctAnswer = "JavaScript";

        document.getElementById("question").innerHTML =
            "Which language is used for web interactivity?";

        function checkAnswer(answer) {

            if(answer == correctAnswer){
                document.getElementById("result").innerHTML = "Correct Answer";
            }
            else{
                document.getElementById("result").innerHTML = "Wrong Answer";
            }

        }

    </script>

</body>
</html>
