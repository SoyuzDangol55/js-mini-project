<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer (button click → change background)</title>
</head>
<body>
      <h1 id="display">Click the button to change background color!</h1>
         <button id="change">Change Color</button>
         <script>
                 const btn = document.getElementById('change');
                const display = document.getElementById('display');


                 let colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'cyan'];

                 btn.addEventListener('click',function(){
                   let random = Math.floor(Math.random() * colors.length);
                    document.body.style.backgroundColor = colors[random];
                    display.textContent = 'Background Color: ' + colors[random];
                 });    
            </script>
</body>
</html>
